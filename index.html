<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGHSS</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-white min-h-screen ">
     <!--Header Start..-->
  
<div class="py-5">
 <div class="text-center space-y-3" data-aos="fade-down" data-aos-duration="1000">
            <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest bg-blue-300 text-slate-950 shadow-lg shadow-amber-500/20">
                <i class="fas fa-calendar-alt"></i> Teachers Timetable
            </span>
            <h1 class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight">
                Table <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-indigo-600 to-blue-600">Time</span>
            </h1>
            <p class="text-slate-600 text-base font-bold max-w-2xl mx-auto">
School Timetable 2026 - Teacher Wise Schedule            </p>
        </div>

</div>
        
        
<div class="max-w-4xl mx-auto px-4 py-8">

        <div class="bg-blue-50 shadow-2xl shadow-blue-900/50 rounded-3xl border-[8px] border-blue-600 p-6 md:p-8">

            <div class="bg-gray-50 p-6 rounded-2xl border border-blue-200 shadow-inner mb-8">

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">
                            <i class="fas fa-graduation-cap mr-1 text-blue-500"></i>
                            Teacher's Name:
                        </label>

                        <input
                            type="text"
                            id="teacherName"
                            placeholder="Ms. Farwa"
                            class="w-full px-4 py-2.5 bg-white border border-blue-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800"
                        >
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">
                            <i class="fas fa-clock mr-1 text-blue-500"></i>
                            Class & Period Details:
                        </label>

                        <textarea
                            id="timetableDetails"
                            rows="3"
                            placeholder="9th Sci: Computer | 9:30 - 10:30 
10th Sci: Computer | 10:30 - 11:30"
                            
                            class="w-full px-4 py-2.5 bg-white border border-blue-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800"
                        ></textarea>
                    </div>
                    <button
                        type="button"
                        id="okBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold sm:py-2.5 py-2 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2"
                    >
                        <i class="fas fa-plus-circle"></i>
                        OK (Add to List) ?
                    </button>

                </div>
            </div>
            <div class="mb-8">

                <h3 class="text-lg font-bold text-gray-800 mb-3 flex items-center  gap-2">
                    <i class="fas fa-list text-blue-700"></i>
                    Added Entries:
                </h3>

                <div
                    id="tempList"
                    class="grid grid-cols-1 md:grid-cols-2 gap-4 border border-blue-300 rounded-xl"
                ></div>
                <div id="confirmContainer" class="mt-6 hidden">

                    <button
                        type="button"
                        id="confirmBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white sm:font-extrabold font-bold py-3.5 sm:px-6 px-4 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 sm:text-lg text-sm"
                    >
                        <i class="fas fa-check-double"></i>
                        Confrm Time Table
                    </button>

                </div>

            </div>
            <div class="border-t border-blue-200 pt-6">

                <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center justify-between">

                    <span>
                        <i class="fas fa-calendar-check text-blue-600"></i>
                        Final Time Table:
                    </span>

                    <button
                        type="button"
                        id="resetBtn"
                        class="text-xs text-red-500 hover:underline"
                    >
                        <i class="fas fa-trash"></i>
                        Reset All
                    </button>

                </h3>


                <div
                    id="finalList"
                    class="grid grid-cols-1 md:grid-cols-2 gap-4"
                ></div>

            </div>

        </div>
    </div>

    </div>
    
</div>


    <script>
        let tempEntries = [];
        const teacherInput = document.getElementById("teacherName");
        const detailsInput = document.getElementById("timetableDetails");

        const okBtn = document.getElementById("okBtn");

        const tempList = document.getElementById("tempList");

        const confirmContainer =
            document.getElementById("confirmContainer");

        const confirmBtn =
            document.getElementById("confirmBtn");

        const finalList =
            document.getElementById("finalList");

        const resetBtn =
            document.getElementById("resetBtn");


        // Page load
        window.addEventListener("DOMContentLoaded", function () {
            renderTemp();
            displayFinal();
        });
        okBtn.addEventListener("click", function () {

            const name = teacherInput.value.trim();
            const details = detailsInput.value.trim();


            if (!name || !details) {

                alert(
                    "Please Enter Teacher's Name and Class/Period Details before adding to the list..."
                );

                return;
            }
            tempEntries.push({
                name: name,
                details: details
            });
            teacherInput.value = "";
            detailsInput.value = "";
            renderTemp();

            teacherInput.focus();
        });
        function renderTemp() {

            tempList.innerHTML = "";


            if (tempEntries.length === 0) {

                tempList.innerHTML = `
                    <div class="col-span-2 text-center py-6 text-gray-400 bg-gray-50 rounded-xl border border-dashed border-gray-300 text-sm">
                        Still no entries added...
                    </div>
                `;

                confirmContainer.classList.add("hidden");

                return;
            }
            confirmContainer.classList.remove("hidden");


            tempEntries.forEach(function (item, index) {

                const card = document.createElement("div");

                card.className =
                    "bg-blue-50 border border-blue-200 p-4 rounded-xl relative shadow-sm space-y-3";


                card.innerHTML = `

                    <button
                        type="button"
                        onclick="removeTempEntry(${index})"
                        class="absolute top-3 right-3 text-red-400 hover:text-red-600 text-xs p-1"
                        title="Delete"
                    >
                        <i class="fas fa-times-circle text-base"></i>
                    </button>


                    <div>

                        <span class="text-xs font-bold text-blue-700 uppercase tracking-wider block mb-1">
                            <i class="fas fa-graduation-cap mr-1"></i>
                            Teacher
                        </span>

                        <div class="font-bold text-gray-900 bg-white px-3 py-2 rounded-lg border border-blue-100">
                            ${escapeHtml(item.name)}
                        </div>

                    </div>


                    <div>

                        <span class="text-xs font-bold text-blue-700 uppercase tracking-wider block mb-1">
                            <i class="fas fa-clock mr-1"></i>
                            Period / Details
                        </span>

                        <div class="text-gray-700 text-sm whitespace-pre-line bg-white p-3 rounded-lg border border-blue-100">
                            ${escapeHtml(item.details)}
                        </div>

                    </div>

                `;


                tempList.appendChild(card);

            });

        }
        window.removeTempEntry = function (index) {

            tempEntries.splice(index, 1);

            renderTemp();
        };

        confirmBtn.addEventListener("click", function () {

            if (tempEntries.length === 0) {
                return;
            }

            let userPassword = prompt("Enter the Password:");
            if (userPassword === null) return;

            if (userPassword !== "MdmFarwa12@") {
                alert("Wrong Password.. Please enter correct password to publish the timetable:");
                return;
            }

            let saved =
                JSON.parse(
                    localStorage.getItem("mySchoolTimetable")
                ) || [];
            saved.push(...tempEntries);
            localStorage.setItem(
                "mySchoolTimetable",
                JSON.stringify(saved)
            );
            tempEntries = [];


            renderTemp();

            displayFinal();


            alert("Successfully Published..");
        });
        function displayFinal() {

            let saved =
                JSON.parse(
                    localStorage.getItem("mySchoolTimetable")
                ) || [];


            finalList.innerHTML = "";


            if (saved.length === 0) {

                finalList.innerHTML = `
                    <div class="col-span-2 text-center py-6 text-gray-400 bg-gray-50 rounded-xl border border-dashed border-gray-300 text-sm">
                        Still no published timetable available...
                    </div>
                `;

                return;
            }


            saved.forEach(function (item, index) {

                const card = document.createElement("div");

                card.className =
                    "bg-gradient-to-br from-blue-100 to-blue-200 border border-blue-200 p-5 rounded-2xl shadow-sm relative space-y-3";


                card.innerHTML = `

                    <button
                        type="button"
                        onclick="deleteFinalEntry(${index})"
                        class="absolute top-4 right-4 text-red-400 hover:text-red-600 bg-white p-2 rounded-full shadow-sm text-xs"
                        title="Delete"
                    >
                        <i class="fas fa-trash-alt"></i>
                    </button>


                    <div>

                        <span class="text-xs font-bold text-blue-700 uppercase tracking-wider block mb-1">
                            <i class="fas fa-graduation-cap mr-1"></i>
                            Teacher
                        </span>

                        <div class="text-lg font-bold text-blue-900 bg-white px-3 py-2 rounded-xl border border-blue-100 pr-10">
                            ${escapeHtml(item.name)}
                        </div>

                    </div>


                    <div>

                        <span class="text-xs font-bold text-blue-700 uppercase tracking-wider block mb-1">
                            <i class="fas fa-clock mr-1"></i>
                            Period / Details
                        </span>

                        <div class="text-gray-700 text-sm whitespace-pre-line bg-white p-3 rounded-xl border border-blue-100">
                            ${escapeHtml(item.details)}
                        </div>

                    </div>


                    <div class="text-xs text-emerald-600 font-semibold flex items-center gap-1">
                        <i class="fas fa-check-circle"></i>
                        Published
                    </div>

                `;


                finalList.appendChild(card);

            });

        }

        window.deleteFinalEntry = function (index) {

            let userPassword = prompt("Enter the Password:");
            if (userPassword === null) return;

            if (userPassword !== "MdmFarwa12@") {
                alert("Wrong Password.. Please enter correct password to delete the entry:");
                return;
            }

            let saved =
                JSON.parse(
                    localStorage.getItem("mySchoolTimetable")
                ) || [];


            saved.splice(index, 1);


            localStorage.setItem(
                "mySchoolTimetable",
                JSON.stringify(saved)
            );


            displayFinal();
        };
        resetBtn.addEventListener("click", function () {

            let userPassword = prompt("Enter Password to reset:");
            if (userPassword === null) return;

            if (userPassword !== "MdmFarwa12@") {
                alert("Wrong Password.. Please enter correct password to reset the timetable:");
                return;
            }


            localStorage.removeItem("mySchoolTimetable");

            displayFinal();
        });
        function escapeHtml(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }
        teacherInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                detailsInput.focus();
            }

        });


        detailsInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter" && event.ctrlKey) {

                event.preventDefault();

                okBtn.click();
            }

        });

    </script>
     <!--Footer-->
 

</body>
</html>
